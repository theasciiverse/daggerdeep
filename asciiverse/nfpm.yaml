# System packages (.deb, .rpm, .apk, Arch) for Dagger Deep, built by nfpm
# from the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# puts the binary at stage/daggerdeep.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: daggerdeep
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/daggerdeep
license: GPL-1.0-or-later
description: |
  A terminal roguelike, solo or two-player co-op.
  Descend through ten dungeon levels, slay monsters, loot chests and face
  the undying Lich. Two players can play together over the network.
  By Chad Lung, packaged by Asciiverse.
contents:
  - src: stage/daggerdeep
    dst: /usr/bin/daggerdeep
    file_info: { mode: 0755 }
  - src: COPYING
    dst: /usr/share/doc/daggerdeep/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/daggerdeep/README.md
    file_info: { mode: 0644 }
